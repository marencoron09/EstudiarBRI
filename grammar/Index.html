<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Study Guide · Grade 2</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#243248;background:#f3f6fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:22px 16px 70px}header{background:#233f75;color:white;border-radius:20px;padding:26px}h1{margin:0;font-size:2rem}header p{margin-bottom:0}.bar{height:12px;background:#dbe5f4;border-radius:20px;overflow:hidden;margin:14px 0}.fill{height:100%;background:#36a77a;width:0;transition:.2s}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button{cursor:pointer;font:inherit;border-radius:10px;padding:10px 14px;border:1px solid #b8c8e1;background:white;color:#233f75;font-weight:650}button.active,.primary{background:#274e90;color:white;border-color:#274e90}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #e8a635;outline-offset:2px}section{display:none}section.active{display:block}.lesson{background:#e7f0ff;padding:17px;border-radius:14px;margin:15px 0 22px;line-height:1.65}.question{background:white;border:1px solid #dce4f0;border-radius:15px;padding:17px;margin:12px 0}.qtop{font-weight:750;margin-bottom:10px}.hint{font-size:.92rem;color:#53647c}.options{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0}.option{padding:9px 14px;border:1px solid #aebed7;border-radius:12px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}.option:has(input:checked){background:#e2edff;border-color:#3862a5}.option input{accent-color:#315c9c}input[type=text],textarea,select{border:1px solid #9dafca;border-radius:9px;padding:11px;font:inherit;width:100%;max-width:570px;background:#fff}textarea{min-height:76px;resize:vertical}.feedback{margin-top:10px;font-weight:600}.good{color:#11704c}.bad{color:#b14337}.review{color:#775a11}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row select{width:auto;min-width:170px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}.score{background:#fff;border:1px solid #c9d6e9;padding:20px;border-radius:14px;margin:16px 0}.small{font-size:.88rem}.tag{background:#edf3fb;border-radius:9px;padding:3px 8px;display:inline-block;margin:3px}.hide{display:none}@media print{nav,.actions{display:none}section{display:block!important}.question{break-inside:avoid}}</style></head><body><main class="wrap"><header><h1>🌟 Grammar Study Guide</h1><p>Grade 2 · 30 activities · Antonyms, Adjectives & Adverbs</p><p class="small">Practice the same skills and vocabulary from pages 292, 293, 299, 300 and 290.</p></header><div class="bar"><div class="fill" id="progress"></div></div><div id="progressText" class="small">0 of 30 answered</div><nav><button class="active" data-tab="antonyms">1 · Antonyms</button><button data-tab="adjectives">2 · Adjectives</button><button data-tab="adverbs">3 · Adverbs</button></nav><div id="sections"></div><div class="actions"><button class="primary" id="check">Check my answers</button><button id="reset">Start over</button><button id="print">Print</button></div><div id="results" aria-live="polite"></div></main><script>
const sections=[{id:'antonyms',title:'Antonyms — Opposite Words',lesson:'<b>Antonyms</b> are words that mean the opposite. <b>Example:</b> noisy ↔ quiet; up ↔ down. To find an antonym, think: “What means the opposite?”',qs:[
{t:'choice',p:'Choose the antonym of noisy.',o:['quiet','sweet','right'],a:'quiet'},
{t:'choice',p:'Choose the antonym of neat.',o:['messy','easy','open'],a:'messy'},
{t:'choice',p:'Choose the antonym of left.',o:['down','right','never'],a:'right'},
{t:'choice',p:'Choose the antonym of always.',o:['never','hard','sour'],a:'never'},
{t:'choice',p:'Choose the antonym of sweet.',o:['quiet','sour','messy'],a:'sour'},
{t:'choice',p:'Choose the antonym of open.',o:['close','up','left'],a:'close'},
{t:'choice',p:'Choose the antonym of easy.',o:['hard','right','sweet'],a:'hard'},
{t:'choice',p:'Choose the antonym of up.',o:['never','down','neat'],a:'down'},
{t:'match',p:'Match the word <b>noisy</b> to its opposite.',o:['hard','quiet','sour'],a:'quiet'},
{t:'text',p:'Unscramble the opposite of <b>always</b>: <b>vneer</b>',a:['never']}
]},{id:'adjectives',title:'Adjectives — Describing Nouns',lesson:'An <b>adjective</b> describes a <b>noun</b> (person, place, animal, or thing). It answers <b>What kind?</b> or <b>How many?</b> <b>Examples:</b> a <b>yellow</b> lion; a <b>cute</b> panda; <b>three</b> cupcakes. Adjectives describe nouns, not actions.',qs:[
{t:'choice',p:'Which word is an adjective for <b>lions</b>?',o:['yellow','quickly','jump'],a:'yellow'},
{t:'choice',p:'Choose the adjective: <b>cute pandas</b>.',o:['pandas','cute','play'],a:'cute'},
{t:'choice',p:'Choose the adjective that makes sense: ___ elephants.',o:['big','slowly','listen'],a:'big'},
{t:'choice',p:'Choose the adjective: ___ polar bears.',o:['white','carefully','run'],a:'white'},
{t:'choice',p:'Choose an adjective for ___ crayon.',o:['pink','softly','write'],a:'pink'},
{t:'choice',p:'Choose an adjective for ___ sandwich.',o:['yummy','swiftly','stops'],a:'yummy'},
{t:'match',p:'Match the noun <b>friend</b> with a describing adjective.',o:['kind','loudly','jumped'],a:'kind'},
{t:'match',p:'Match the noun <b>cupcakes</b> with a describing adjective.',o:['sweet','quickly','giggle'],a:'sweet'},
{t:'text',p:'Write ONE adjective to complete: “A ___ worm.”',a:['little','small','long','tiny','green','pink','brown','wiggly','slimy','stinky','big','fat','thin']},
{t:'text',p:'Write ONE adjective to complete: “A ___ teddy bear.”',a:['cute','soft','little','small','big','brown','fluffy','cuddly','lovely','sweet','adorable','pink','white']}
]},{id:'adverbs',title:'Adverbs — How an Action Is Done',lesson:'An <b>adverb</b> describes a <b>verb</b> (an action). It often answers <b>How?</b> Many adverbs end in <b>-ly</b>. <b>Examples:</b> The girl runs <b>quickly</b>. The baby sleeps <b>peacefully</b>. Mom smiled <b>kindly</b>. <b>Sentence example:</b> “The boy plays happily.” Write a <b>complete sentence</b> with a subject, verb, and adverb.',qs:[
{t:'choice',p:'Which word tells HOW the girl runs?',o:['quickly','happy','girl'],a:'quickly'},
{t:'choice',p:'Choose the adverb in “Mom smiled kindly.”',o:['Mom','smiled','kindly'],a:'kindly'},
{t:'choice',p:'Choose an adverb to complete: “The child listens ___.”',o:['carefully','pretty','blue'],a:'carefully'},
{t:'choice',p:'Choose an adverb to complete: “The turtle moves ___.”',o:['slowly','green','small'],a:'slowly'},
{t:'choice',p:'Choose the adverb to complete: “The baby sleeps ___.”',o:['softly','soft','sleep'],a:'softly'},
{t:'sentence',p:'Write a complete sentence using the adverb <b>slowly</b>.',word:'slowly',sample:'The turtle walks slowly.'},
{t:'sentence',p:'Write a complete sentence using the adverb <b>quickly</b>.',word:'quickly',sample:'The boy runs quickly.'},
{t:'sentence',p:'Write a complete sentence using the adverb <b>softly</b>.',word:'softly',sample:'Mom speaks softly.'},
{t:'sentence',p:'Write a complete sentence using the adverb <b>quietly</b>.',word:'quietly',sample:'The children read quietly.'},
{t:'sentence',p:'Write a complete sentence using the adverb <b>carefully</b>.',word:'carefully',sample:'She carries the glass carefully.'}
]}];
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let counter=0;document.getElementById('sections').innerHTML=sections.map((s,si)=>`<section id="${s.id}" class="${si===0?'active':''}"><h2>${s.title}</h2><div class="lesson">${s.lesson}</div>${s.qs.map(q=>{const n=++counter;return `<article class="question" data-n="${n}"><div class="qtop">${n}. ${q.p}</div>${q.t==='choice'?`<div class="options">${q.o.map((o,i)=>`<label class="option"><input type="radio" name="q${n}" value="${escapeHtml(o)}"> ${escapeHtml(o)}</label>`).join('')}</div>`:q.t==='match'?`<div class="row"><span>Choose the match:</span><select aria-label="Match answer for question ${n}" data-input="${n}"><option value="">Select…</option>${q.o.map(o=>`<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('')}</select></div>`:q.t==='text'?`<input type="text" data-input="${n}" aria-label="Answer to question ${n}" autocomplete="off" spellcheck="false">`:`<textarea data-input="${n}" aria-label="Sentence for question ${n}" placeholder="Write a complete sentence here..."></textarea><div class="hint">Remember: capital letter + complete thought + punctuation.</div>`}<div class="feedback" id="f${n}" aria-live="polite"></div></article>`}).join('')}</section>`).join('');
const all=sections.flatMap(s=>s.qs);function getVal(n,q){let el=q.t==='choice'?document.querySelector(`input[name="q${n}"]:checked`):document.querySelector(`[data-input="${n}"]`);return el?.value?.trim()||''}function update(){const filled=all.filter((q,i)=>getVal(i+1,q)).length;document.getElementById('progress').style.width=filled/30*100+'%';document.getElementById('progressText').textContent=`${filled} of 30 answered`;}document.addEventListener('input',update);document.addEventListener('change',update);document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id===b.dataset.tab));}));
document.getElementById('check').onclick=()=>{let correct=0,graded=0,review=0,blank=0;all.forEach((q,i)=>{let n=i+1,v=getVal(n,q),f=document.getElementById('f'+n);f.className='feedback';if(!v){blank++;f.textContent='Not answered yet.';f.classList.add('review');return}if(q.t==='sentence'){review++;const has=new RegExp('\\b'+q.word+'\\b','i').test(v),words=v.match(/[A-Za-z]+(?:'[A-Za-z]+)?/g)||[],cap=/^[A-Z]/.test(v),end=/[.!?]$/.test(v.trim());f.classList.add('review');f.innerHTML=`Check your sentence: ${has?'✓ uses '+q.word:'✗ add '+q.word}; ${words.length>=4?'✓ at least 4 words':'✗ write a complete sentence'}; ${cap?'✓ capital letter':'✗ start with a capital'}; ${end?'✓ ending punctuation':'✗ add punctuation'}.<br><span class="small">Example: ${escapeHtml(q.sample)}. An adult should check that your sentence makes sense.</span>`;return}graded++;let ok=Array.isArray(q.a)?q.a.includes(v.toLowerCase().replace(/[.!?]$/,'')):v.toLowerCase()===q.a.toLowerCase();if(ok){correct++;f.classList.add('good');f.textContent='✓ Correct!'}else{f.classList.add('bad');f.textContent='Try again. '+(q.t==='text'?'Example answer: '+q.a[0]: 'Correct answer: '+q.a)}});document.getElementById('results').innerHTML=`<div class="score"><h2>Practice results</h2><p><b>${correct} / ${graded}</b> automatically checked answers correct.</p><p>${review} written sentences need a teacher or parent to review. ${blank} unanswered questions.</p><p class="small">Sentence checks are writing hints, not a grammar grade. Other suitable adjectives may be correct even if not in the suggested answer list.</p></div>`;document.getElementById('results').scrollIntoView({behavior:'smooth',block:'nearest'})};document.getElementById('reset').onclick=()=>{if(!confirm('Clear all your answers and start over?'))return;document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);document.querySelectorAll('input[type=text],textarea').forEach(x=>x.value='');document.querySelectorAll('select').forEach(x=>x.value='');document.querySelectorAll('.feedback').forEach(x=>x.textContent='');document.getElementById('results').innerHTML='';update()};document.getElementById('print').onclick=()=>window.print();update();</script></body></html>
