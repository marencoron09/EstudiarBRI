<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Study Guide · Grade 2</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#243248;background:#f3f6fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:22px 16px 70px}header{background:#233f75;color:white;border-radius:20px;padding:26px}h1{margin:0;font-size:2rem}header p{margin-bottom:0}.bar{height:12px;background:#dbe5f4;border-radius:20px;overflow:hidden;margin:14px 0}.fill{height:100%;background:#36a77a;width:0;transition:.2s}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button{cursor:pointer;font:inherit;border-radius:10px;padding:10px 14px;border:1px solid #b8c8e1;background:white;color:#233f75;font-weight:650}button.active,.primary{background:#274e90;color:white;border-color:#274e90}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #e8a635;outline-offset:2px}section{display:none}section.active{display:block}.lesson{background:#e7f0ff;padding:17px;border-radius:14px;margin:15px 0 22px;line-height:1.65}.question{background:white;border:1px solid #dce4f0;border-radius:15px;padding:17px;margin:12px 0}.qtop{font-weight:750;margin-bottom:10px}.hint{font-size:.92rem;color:#53647c}.options{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0}.option{padding:9px 14px;border:1px solid #aebed7;border-radius:12px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}.option:has(input:checked){background:#e2edff;border-color:#3862a5}.option input{accent-color:#315c9c}input[type=text],textarea,select{border:1px solid #9dafca;border-radius:9px;padding:11px;font:inherit;width:100%;max-width:570px;background:#fff}textarea{min-height:76px;resize:vertical}.feedback{margin-top:10px;font-weight:600}.good{color:#11704c}.bad{color:#b14337}.review{color:#775a11}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row select{width:auto;min-width:170px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}.score{background:#fff;border:1px solid #c9d6e9;padding:20px;border-radius:14px;margin:16px 0}.small{font-size:.88rem}.tag{background:#edf3fb;border-radius:9px;padding:3px 8px;display:inline-block;margin:3px}.hide{display:none}@media print{nav,.actions{display:none}section{display:block!important}.question{break-inside:avoid}}</style></head><body><main class="wrap"><header><h1>🌟 Grammar Study Guide</h1><p>Grade 2 · 24 activities · Antonyms, Adjectives & Adverbs</p><p class="small">Practice the same skills and vocabulary from pages 292, 293, 299, 300 and 290.</p></header><div class="bar"><div class="fill" id="progress"></div></div><div id="progressText" class="small">0 of 24 answered</div><nav><button class="active" data-tab="antonyms">1 · Antonyms</button><button data-tab="adjectives">2 · Adjectives</button><button data-tab="adverbs">3 · Adverbs</button></nav><div id="sections"></div><div class="actions"><button class="primary" id="check">Check my answers</button><button id="reset">Start over</button><button id="print">Print</button></div><div id="results" aria-live="polite"></div></main><script>
const sections=[{id:'antonyms',title:'Antonyms — Write the Opposite Word',lesson:'<b>Antonyms</b> are words that mean the opposite. <b>Example:</b> hot ↔ cold. <b>Page 292, Exercise 3:</b> Write the opposite of each word in the blank. Check your spelling!',qs:[
{t:'text',p:'Write the antonym of <b>noisy</b>.',a:['quiet']},
{t:'text',p:'Write the antonym of <b>neat</b>.',a:['messy']},
{t:'text',p:'Write the antonym of <b>left</b>.',a:['right']},
{t:'text',p:'Write the antonym of <b>always</b>.',a:['never']},
{t:'text',p:'Write the antonym of <b>sweet</b>.',a:['sour']},
{t:'text',p:'Write the antonym of <b>open</b>.',a:['close']},
{t:'text',p:'Write the antonym of <b>easy</b>.',a:['hard']},
{t:'text',p:'Write the antonym of <b>up</b>.',a:['down']}
]},{id:'adjectives',title:'Adjectives — Write Your Own Words',lesson:'An <b>adjective</b> describes a <b>noun</b>. Examples: <b>sweet</b> cupcakes, a <b>kind</b> friend, a <b>pink</b> crayon. <b>Write your own adjective</b> in every blank — do not choose from options.',qs:[
{t:'open',p:'Write an <b>adjective</b> for the noun <b>cupcakes</b>. (Pages 293, 299, 300)',sample:'sweet'},
{t:'open',p:'Write an <b>adjective</b> for the noun <b>friend</b>. (Pages 293, 299, 300)',sample:'kind'},
{t:'open',p:'Write an <b>adjective</b> for the noun <b>crayon</b>. (Pages 293, 299, 300)',sample:'pink'},
{t:'open',p:'Write an <b>adjective</b> for the noun <b>kittens</b>. (Pages 293, 299, 300)',sample:'playful'},
{t:'open',p:'Write an <b>adjective</b> for the noun <b>Mom</b>. (Pages 293, 299, 300)',sample:'loving'},
{t:'open',p:'Write an <b>adjective</b> for the noun <b>worm</b>. (Pages 293, 299, 300)',sample:'long'},
{t:'open',p:'Write an <b>adjective</b> for the noun <b>sandwich</b>. (Pages 293, 299, 300)',sample:'delicious'},
{t:'open',p:'Write an <b>adjective</b> for the noun <b>lions</b>. (Pages 293, 299, 300)',sample:'brave'},
{t:'open',p:'Write an <b>adjective</b> for the noun <b>pandas</b>. (Pages 293, 299, 300)',sample:'cute'},
{t:'open',p:'Write an <b>adjective</b> for the noun <b>elephants</b>. (Pages 293, 299, 300)',sample:'large'},
{t:'open',p:'Write an <b>adjective</b> for the noun <b>polar bears</b>. (Pages 293, 299, 300)',sample:'white'}
]},{id:'adverbs',title:'Adverbs — Write Five Complete Sentences',lesson:'An <b>adverb</b> tells how an action happens. Write one sentence for each word. <b>Include a subject (noun or pronoun), a verb, and the adverb.</b> Start with a capital letter and end with a period. In the simple present, <b>he, she, it</b> and singular nouns usually need <b>-s</b> or <b>-es</b> on the verb. Examples: <b>The girl walks slowly.</b> <b>The boy watches carefully.</b> (Not “The girl walk slowly.”)',qs:[
{t:'sentence',p:'Write a sentence with <b>slowly</b>.',word:'slowly',sample:'The turtle walks slowly.'},
{t:'sentence',p:'Write a sentence with <b>quickly</b>.',word:'quickly',sample:'The boy runs quickly.'},
{t:'sentence',p:'Write a sentence with <b>softly</b>.',word:'softly',sample:'Mom speaks softly.'},
{t:'sentence',p:'Write a sentence with <b>quietly</b>.',word:'quietly',sample:'The children read quietly.'},
{t:'sentence',p:'Write a sentence with <b>carefully</b>.',word:'carefully',sample:'She carries the glass carefully.'}
]}];
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let counter=0;document.getElementById('sections').innerHTML=sections.map((s,si)=>`<section id="${s.id}" class="${si===0?'active':''}"><h2>${s.title}</h2><div class="lesson">${s.lesson}</div>${s.qs.map(q=>{const n=++counter;return `<article class="question" data-n="${n}"><div class="qtop">${n}. ${q.p}</div>${q.t==='choice'?`<div class="options">${q.o.map((o,i)=>`<label class="option"><input type="radio" name="q${n}" value="${escapeHtml(o)}"> ${escapeHtml(o)}</label>`).join('')}</div>`:q.t==='match'?`<div class="row"><span>Choose the match:</span><select aria-label="Match answer for question ${n}" data-input="${n}"><option value="">Select…</option>${q.o.map(o=>`<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('')}</select></div>`:(q.t==='text'||q.t==='open')?`<input type="text" data-input="${n}" aria-label="Answer to question ${n}" autocomplete="off" spellcheck="false">`:`<textarea data-input="${n}" aria-label="Sentence for question ${n}" placeholder="Write a complete sentence here..."></textarea><div class="hint">Remember: capital letter + complete thought + punctuation.</div>`}<div class="feedback" id="f${n}" aria-live="polite"></div></article>`}).join('')}</section>`).join('');
const all=sections.flatMap(s=>s.qs);function getVal(n,q){let el=q.t==='choice'?document.querySelector(`input[name="q${n}"]:checked`):document.querySelector(`[data-input="${n}"]`);return el?.value?.trim()||''}function update(){const filled=all.filter((q,i)=>getVal(i+1,q)).length;document.getElementById('progress').style.width=filled/all.length*100+'%';document.getElementById('progressText').textContent=`${filled} of ${all.length} answered`;}document.addEventListener('input',update);document.addEventListener('change',update);document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id===b.dataset.tab));}));
function checkSentence(sentence,required){
 const v=sentence.trim(), notes=[],issues=[];
 const check=(ok,yes,no)=>{notes.push((ok?'✓ ':'✗ ')+(ok?yes:no));if(!ok)issues.push(no)};
 check(/^[A-Z]/.test(v),'Starts with a capital letter','Start with a capital letter');
 check(/\.$/.test(v),'Ends with a period','End the sentence with a period (.)');
 check(new RegExp('\\b'+required+'\\b','i').test(v),'Uses the word '+required,'Include the adverb '+required);
 const tokens=(v.match(/[A-Za-z]+(?:'[A-Za-z]+)?/g)||[]),lower=tokens.map(x=>x.toLowerCase());
 const pronouns=['i','you','he','she','it','we','they'];
 const determiners=['the','a','an','my','your','his','her','our','their','this','that','these','those'];
 const verbs=['walk','walks','run','runs','speak','speaks','talk','talks','read','reads','move','moves','play','plays','sing','sings','dance','dances','watch','watches','wash','washes','brush','brushes','fix','fixes','go','goes','do','does','carry','carries','study','studies','try','tries','write','writes','eat','eats','drink','drinks','jump','jumps','sleep','sleeps','sit','sits','listen','listens','work','works','help','helps','open','opens','close','closes','paint','paints','draw','draws','smile','smiles','whisper','whispers','crawl','crawls','drive','drives','ride','rides','swim','swims','clean','cleans','cook','cooks','look','looks','pick','picks','hold','holds','touch','touches','is','are','am','was','were','has','have','had'];
 const vi=lower.findIndex((w,i)=>i>0&&verbs.includes(w));
 const hasSubject=lower.length>0&&(pronouns.includes(lower[0])||determiners.includes(lower[0])&&lower.length>2||vi>0);
 check(hasSubject,'A possible subject is present','Include a subject (a noun or pronoun)');
 check(vi>0,'A recognizable verb is present','Include an action verb (or ask an adult to check an unfamiliar verb)');
 if(vi>0){
   const subject=lower.slice(0,vi),head=subject[0],verb=lower[vi];
   const pluralPronouns=['i','you','we','they'];
   const thirdPronouns=['he','she','it'];
   let singular=thirdPronouns.includes(head),plural=pluralPronouns.includes(head);
   if(!singular&&!plural&&subject.length){const noun=subject[subject.length-1];if(noun&& !['and'].includes(noun)){plural=/s$/.test(noun)&& !/ss$/.test(noun);singular=!plural;}}
   const baseToThird={walk:'walks',run:'runs',speak:'speaks',talk:'talks',read:'reads',move:'moves',play:'plays',sing:'sings',dance:'dances',watch:'watches',wash:'washes',brush:'brushes',fix:'fixes',go:'goes',do:'does',carry:'carries',study:'studies',try:'tries',write:'writes',eat:'eats',drink:'drinks',jump:'jumps',sleep:'sleeps',sit:'sits',listen:'listens',work:'works',help:'helps',open:'opens',close:'closes',paint:'paints',draw:'draws',smile:'smiles',whisper:'whispers',crawl:'crawls',drive:'drives',ride:'rides',swim:'swims',clean:'cleans',cook:'cooks',look:'looks',pick:'picks',hold:'holds',touch:'touches',has:'has',have:'has'};
   const thirdToBase=Object.fromEntries(Object.entries(baseToThird).map(([a,b])=>[b,a]));
   let expected=null;
   if(singular&&baseToThird[verb]&&verb!=='has')expected=baseToThird[verb];
   if(plural&&thirdToBase[verb])expected=thirdToBase[verb];
   if(singular&&verb==='are')expected='is';
   if(plural&&verb==='is')expected=head==='i'?'am':'are';
   if(head==='i'&&verb==='are')expected='am';
   if(singular&&verb==='have')expected='has';
   if(plural&&verb==='has')expected='have';
   check(!expected,expected?'Verb agreement: use "'+expected+'" instead of "'+verb+'"':'Verb agreement: no common error detected', 'Verb agreement: use "'+expected+'" instead of "'+verb+'"');
 }else notes.push('• Verb agreement needs an adult review.');
 if(tokens.length<4){notes.push('✗ Try writing a fuller sentence');issues.push('short');}
 return {notes,issues};
}
document.getElementById('check').onclick=()=>{let correct=0,graded=0,review=0,blank=0;all.forEach((q,i)=>{let n=i+1,v=getVal(n,q),f=document.getElementById('f'+n);f.className='feedback';if(!v){blank++;f.textContent='Not answered yet.';f.classList.add('review');return}if(q.t==='open'){review++;f.classList.add('review');f.innerHTML='✓ Answer written. An adult should check that the adjective describes the noun and is spelled correctly.<br><span class="small">One possible answer: '+escapeHtml(q.sample)+'</span>';return}if(q.t==='sentence'){review++;const report=checkSentence(v,q.word);f.classList.add(report.issues.length?'bad':'good');f.innerHTML='<b>'+(report.issues.length?'Needs attention:':'✓ Basic checks passed!')+'</b><br>'+report.notes.map(x=>escapeHtml(x)).join('<br>')+'<br><span class="small">Example: '+escapeHtml(q.sample)+' This checker cannot confirm every possible verb or sentence structure. Have an adult review the meaning and grammar.</span>';return}graded++;let ok=Array.isArray(q.a)?q.a.includes(v.toLowerCase().replace(/[.!?]$/,'')):v.toLowerCase()===q.a.toLowerCase();if(ok){correct++;f.classList.add('good');f.textContent='✓ Correct!'}else{f.classList.add('bad');f.textContent='Try again. '+(q.t==='text'?'Example answer: '+q.a[0]: 'Correct answer: '+q.a)}});document.getElementById('results').innerHTML=`<div class="score"><h2>Practice results</h2><p><b>${correct} / ${graded}</b> automatically checked answers correct.</p><p>${review} open-ended answers need a teacher or parent to review. ${blank} unanswered questions.</p><p class="small">Sentence checks are writing hints, not a grammar grade. Other suitable adjectives may be correct even if not in the suggested answer list.</p></div>`;document.getElementById('results').scrollIntoView({behavior:'smooth',block:'nearest'})};document.getElementById('reset').onclick=()=>{if(!confirm('Clear all your answers and start over?'))return;document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);document.querySelectorAll('input[type=text],textarea').forEach(x=>x.value='');document.querySelectorAll('select').forEach(x=>x.value='');document.querySelectorAll('.feedback').forEach(x=>x.textContent='');document.getElementById('results').innerHTML='';update()};document.getElementById('print').onclick=()=>window.print();update();</script></body></html>
