<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EstudiarBRI • Grammar IV</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#eef3f9;margin:0;color:#18304c}
header{background:linear-gradient(120deg,#5655d6,#8574e8);color:white;text-align:center;padding:30px 12px}h1{margin:0 0 9px}
.wrap{max-width:900px;margin:20px auto;padding:0 14px 35px}.card{background:white;border-radius:15px;padding:18px;margin:13px 0;box-shadow:0 2px 8px #0001}
.section{background:#e6e5ff;border-radius:10px;padding:14px;font-size:21px;font-weight:bold;margin-top:27px}
.qtitle{font-size:18px;margin-bottom:14px;line-height:1.5}.num{display:inline-block;background:#5e59d8;color:white;border-radius:50%;min-width:36px;padding:8px;text-align:center;margin-right:8px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.option,.matchitem{padding:13px;text-align:left;border:2px solid #d3dce9;border-radius:9px;background:white;font-size:16px;cursor:pointer;color:#18304c}
.option.selected,.matchitem.selected{border-color:#5e59d8;background:#eae9ff}
.option.correct,.matchitem.correct,input.correct{border-color:#17805d;background:#e3f9ed}
.option.wrong,.matchitem.wrong,input.wrong{border-color:#cb3333;background:#ffe9e9}
input.answer{font-size:17px;border:2px solid #cbd6e4;border-radius:8px;padding:12px;width:min(100%,320px)}
.feedback{margin-top:10px;font-weight:bold;min-height:20px}.good{color:#11764d}.bad{color:#bd3030}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:22px}.actions button{padding:13px 22px;background:#5e59d8;color:white;border:0;border-radius:10px;font-size:17px;font-weight:bold;cursor:pointer}
a{color:#514ed0;font-weight:bold}#score{text-align:center;font-size:23px;font-weight:bold}
.match-area{position:relative;display:flex;justify-content:space-between;gap:25px;min-height:335px}
.match-col{display:flex;flex-direction:column;gap:9px;width:42%;position:relative;z-index:1}
.matchitem{text-align:center;min-height:50px}.matchitem.paired{border-color:#5e59d8;background:#f0efff}
.match-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.help{color:#60738a;font-size:14px;margin-bottom:12px}
@media(max-width:550px){.opts{grid-template-columns:1fr}.match-area{gap:10px}.match-col{width:44%}.matchitem{font-size:14px;padding:10px 5px}}
</style></head><body>
<header><h1>✏️ Grammar Challenge</h1><p>IV BIMENSUAL • October 2026 • 45 exercises</p></header>
<main class="wrap"><a href="../index.html">← Back to EstudiarBRI</a>
<div class="card">Three topics • <b>15 exercises each</b>: 10 written answers and 5 matching pairs. Type every answer and connect matching words. <b>New Quiz</b> changes the order.</div>
<div id="quiz"></div><div class="actions"><button id="check" type="button">Check My Work</button><button id="new" type="button">New Quiz ↻</button></div><div id="score" aria-live="polite"></div></main>
<script>
var DATA={"Adjectives": {"write": [["Write the adjective: The fluffy kitten sleeps.", "fluffy"], ["Write a color adjective: The ___ banana is ripe.", "yellow"], ["Write the adjective: We ate juicy grapes.", "juicy"], ["Write the adjective: The little dog is friendly.", "little"], ["Write the adjective: I wore my pink shirt.", "pink"]], "select": [["Write the adjective in: The tall tree grows.", ["tree", "tall", "grows"], "tall"], ["Write the adjective in: The cold water feels good.", ["water", "feels", "cold"], "cold"], ["Which word is an adjective?", ["run", "beautiful", "school"], "beautiful"], ["Write the adjective in: The red kite flies.", ["flies", "kite", "red"], "red"], ["Write an adjective that means feeling joy.", ["happy", "jump", "desk"], "happy"]], "match": [["red", "apple"], ["soft", "pillow"], ["cold", "ice"], ["tall", "giraffe"], ["sweet", "candy"]]}, "Proper & Common Nouns": {"write": [["Write the proper noun: My friend Sofia lives in Managua.", "Sofia"], ["Write the proper noun: We visited Mexico.", "Mexico"], ["Correct the capitalization: maria", "Maria"], ["Correct the capitalization: managua", "Managua"], ["Write the common noun: Carlos reads a book.", "book"]], "select": [["Which is a proper noun?", ["city", "Nicaragua", "country"], "Nicaragua"], ["Which is a common noun?", ["Maria", "school", "Monday"], "school"], ["Rewrite with correct capitalization: i live in managua.", ["i live in managua.", "I live in Managua.", "I live in managua."], "I live in Managua."], ["Which is a proper noun?", ["teacher", "Ana", "girl"], "Ana"], ["Which is a common noun?", ["Amazon River", "river", "Sofia"], "river"]], "match": [["country", "Nicaragua"], ["city", "Managua"], ["girl", "Sofia"], ["boy", "Daniel"], ["month", "October"]]}, "Antonyms": {"write": [["Write the opposite of: hot", "cold"], ["Write the opposite of: happy", "sad"], ["Write the opposite of: fast", "slow"], ["Write the opposite of: old", "new"], ["Write the opposite of: awake", "asleep"]], "select": [["What is the antonym of high?", ["tall", "low", "up"], "low"], ["What is the antonym of good?", ["bad", "nice", "great"], "bad"], ["What is the antonym of easy?", ["simple", "difficult", "quick"], "difficult"], ["What is the antonym of right?", ["correct", "wrong", "straight"], "wrong"], ["What is the antonym of lost?", ["hidden", "found", "small"], "found"]], "match": [["big", "small"], ["open", "closed"], ["day", "night"], ["up", "down"], ["early", "late"]]}};
var state=[], matches=[];
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function el(tag,cls,text){var x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function norm(s){return String(s||"").toLowerCase().replace(/[’‘]/g,"'").trim().replace(/\s+/g," ")}
function addQuestion(host,n,prompt,type,answer,opts){
 var card=el("div","card"),title=el("div","qtitle");title.appendChild(el("span","num",String(n)));title.appendChild(document.createTextNode(prompt));card.appendChild(title);
 var q={type:type,answer:answer,card:card,selected:null},fb=el("div","feedback");q.fb=fb;
 if(type==="write"){q.input=el("input","answer");q.input.type="text";q.input.autocomplete="off";q.input.setAttribute("aria-label",prompt);card.appendChild(q.input)}
 else {var box=el("div","opts");q.buttons=[];shuffle(opts).forEach(function(opt){var b=el("button","option",opt);b.type="button";b.addEventListener("click",function(){q.selected=opt;q.buttons.forEach(function(x){x.classList.remove("selected")});b.classList.add("selected")});box.appendChild(b);q.buttons.push(b)});card.appendChild(box)}
 card.appendChild(fb);host.appendChild(card);state.push(q);
}
function matching(host,topic,pairs,start){
 var card=el("div","card");card.appendChild(el("div","qtitle","Matching — "+topic+" (questions "+start+"–"+(start+4)+")"));
 card.appendChild(el("div","help","Tap one word on the left, then its match on the right. Tap a paired word to remove its line."));
 var area=el("div","match-area"),svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("class","match-svg");
 var left=el("div","match-col"),right=el("div","match-col");
 area.appendChild(svg);area.appendChild(left);area.appendChild(right);card.appendChild(area);
 var m={pairs:pairs,links:{},left:{},right:{},selected:null,area:area,svg:svg,fb:el("div","feedback")};
 pairs.forEach(function(pair,i){var b=el("button","matchitem",pair[0]);b.type="button";b.addEventListener("click",function(){pickLeft(m,i)});left.appendChild(b);m.left[i]=b});
 shuffle(pairs.map(function(p,i){return i})).forEach(function(i){var b=el("button","matchitem",pairs[i][1]);b.type="button";b.addEventListener("click",function(){pickRight(m,i)});right.appendChild(b);m.right[i]=b});
 card.appendChild(m.fb);host.appendChild(card);matches.push(m);draw(m);
}
function pickLeft(m,i){if(m.links[i]!==undefined){delete m.links[i];m.selected=null}else{m.selected=i}draw(m)}
function pickRight(m,i){if(m.selected===null){var found=null;Object.keys(m.links).forEach(function(k){if(m.links[k]===i)found=k});if(found!==null)delete m.links[found]}else{Object.keys(m.links).forEach(function(k){if(m.links[k]===i)delete m.links[k]});m.links[m.selected]=i;m.selected=null}draw(m)}
function draw(m){while(m.svg.firstChild)m.svg.removeChild(m.svg.firstChild);
 Object.keys(m.left).forEach(function(k){m.left[k].className="matchitem"+(m.selected==k?" selected":"")+(m.links[k]!==undefined?" paired":"")});
 Object.keys(m.right).forEach(function(k){var paired=false;Object.keys(m.links).forEach(function(a){if(m.links[a]==k)paired=true});m.right[k].className="matchitem"+(paired?" paired":"")});
 var box=m.area.getBoundingClientRect();m.svg.setAttribute("viewBox","0 0 "+box.width+" "+box.height);
 Object.keys(m.links).forEach(function(k){var l=m.left[k].getBoundingClientRect(),r=m.right[m.links[k]].getBoundingClientRect();if(!r)return;
 var line=document.createElementNS("http://www.w3.org/2000/svg","line");
 line.setAttribute("x1",l.right-box.left);line.setAttribute("y1",l.top+l.height/2-box.top);
 line.setAttribute("x2",r.left-box.left);line.setAttribute("y2",r.top+r.height/2-box.top);
 line.setAttribute("stroke","#5e59d8");line.setAttribute("stroke-width","3");m.svg.appendChild(line)});
}
function newQuiz(){state=[];matches=[];var root=document.getElementById("quiz");root.innerHTML="";document.getElementById("score").textContent="";
 var topics=Object.keys(DATA);topics.forEach(function(topic){var d=DATA[topic],sec=el("div","section",topic+" — 15 exercises");root.appendChild(sec);
 var n=topics.indexOf(topic)*15+1,items=[];
 d.write.forEach(function(x){items.push({type:"write",p:x[0],a:x[1]})});
 d.select.forEach(function(x){items.push({type:"write",p:x[0],a:x[2]})});
 shuffle(items).forEach(function(x,i){addQuestion(root,n+i,x.p,x.type,x.a,x.o)});
 matching(root,topic,shuffle(d.match),n+10);
 });}
function check(){var score=0;state.forEach(function(q){var val=q.type==="write"?q.input.value:q.selected,ok=norm(val)===norm(q.answer);
 if(ok)score++;q.fb.textContent=ok?"✓ Correct!":"✗ "+(val?"Correct answer: ":"Answer: ")+q.answer;
 q.fb.className="feedback "+(ok?"good":"bad");
 if(q.type==="write"){q.input.classList.remove("correct","wrong");q.input.classList.add(ok?"correct":"wrong")}
 else q.buttons.forEach(function(b){b.classList.remove("correct","wrong");if(b.textContent===q.answer)b.classList.add("correct");else if(b.textContent===val)b.classList.add("wrong")});
 });
 matches.forEach(function(m){var count=0;Object.keys(m.links).forEach(function(k){if(Number(k)===Number(m.links[k]))count++});score+=count;
 m.fb.textContent=count+"/5 correct matches";m.fb.className="feedback "+(count===5?"good":"bad");draw(m)});
 document.getElementById("score").textContent="Your score: "+score+" / 45";
}
document.getElementById("new").addEventListener("click",newQuiz);
document.getElementById("check").addEventListener("click",check);
window.addEventListener("resize",function(){matches.forEach(draw)});
newQuiz();
</script></body></html>
